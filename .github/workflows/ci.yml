# Every test on macOS, Windows and Linux: what RSharp ships on. Warnings are errors (.cargo/config.toml).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A fresh runner's first `dotnet` (Roslyn's build host starts one) would otherwise do its first-run setup.
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "macOS (arm64)", os: macos-15 }
          - { name: "Windows (x64)", os: windows-2025 }
          - { name: "Linux (x64)", os: ubuntu-24.04 }
    steps:
      # Passenger's sidecars (vendor/passenger, pinned), which the build makes with dotnet: Roslyn's server as Passenger
      # pins it, its extension and its project host, which the Roslyn tests run.
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false

      - name: The libraries gpui builds against on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libvulkan-dev libfontconfig-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          # The build is kept when a later step fails: a failing test should not cost the next run a cold build.
          cache-on-failure: true

      - uses: actions/setup-dotnet@v4
        with:
          # The offline fixtures use this SDK feature band and its installed reference packs.
          dotnet-version: 10.0.1xx

      - uses: actions/setup-dotnet@v4
        with:
          # Passenger currently needs a preview SDK to build its sidecars.
          global-json-file: vendor/passenger/global.json
          dotnet-quality: preview

      - name: Formatting
        run: cargo fmt --all --check

      - name: Live template test feed (Passenger's Avalonia.Templates 12.1.4)
        run: python tools/prepare-template-tests.py

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Diagnose (temporary)
        if: runner.os == 'macOS'
        shell: bash
        env:
          RSHARP_DIAG: 1
          RSHARP_ENGINE_LOG: ${{ runner.temp }}/diag/engine.log
          MSBUILDDEBUGENGINE: 1
          MSBUILDDEBUGPATH: ${{ runner.temp }}/diag/msbuild
        run: |
          mkdir -p "$RUNNER_TEMP/diag"
          cargo test -p rsharp-app --test xaml --no-fail-fast -- wpf_elements_x_name || true
          unset MSBUILDDEBUGENGINE
          # The cascade starts some 40 sessions in; twenty minutes reaches it and a few sessions after.
          perl -e 'alarm shift; exec @ARGV' 1200 cargo test -p rsharp-dap --test passenger --no-fail-fast -- --test-threads=1 || true
          ps -axo pid,ppid,stat,etime,command | grep -aiE "dotnet|Passenger|Debuggee|ConsoleApp" | grep -v grep || true

      - name: Diagnostic logs (temporary)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: diag-macos
          path: ${{ runner.temp }}/diag

      - name: Tests
        if: false
        # Every suite runs even after one fails, so a run shows all that failed, not only the first binary's.
        run: cargo test --workspace --no-fail-fast
