# Every test on macOS, Windows and Linux: what RSharp ships on. Warnings are errors (.cargo/config.toml).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A fresh runner's first `dotnet` (Roslyn's build host starts one) would otherwise do its first-run setup.
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux (x64)", os: ubuntu-24.04 }
    steps:
      # Passenger's sidecars (vendor/passenger, pinned), which the build makes with dotnet: Roslyn's server as Passenger
      # pins it, its extension and its project host, which the Roslyn tests run.
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false

      - name: The libraries gpui builds against on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libvulkan-dev libfontconfig-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          # The build is kept when a later step fails: a failing test should not cost the next run a cold build.
          cache-on-failure: true

      - uses: actions/setup-dotnet@v4
        with:
          # The offline fixtures use this SDK feature band and its installed reference packs.
          dotnet-version: 10.0.1xx

      - uses: actions/setup-dotnet@v4
        with:
          # Passenger currently needs a preview SDK to build its sidecars.
          global-json-file: vendor/passenger/global.json
          dotnet-quality: preview

      - name: Formatting
        run: cargo fmt --all --check

      - name: Live template test feed (Passenger's Avalonia.Templates 12.1.4)
        run: python tools/prepare-template-tests.py

      - name: Build
        run: cargo build --workspace --all-targets

      # Debugging another process asks macOS for its task port, which a member of _developer gets after a password
      # prompt; the runner has no one to answer it, so the first attach waits for ever and every later one behind it.
      # As Passenger's own CI does: the runner joins _developer and the right asks its members nothing.
      - name: Let the debugger take hold of the runner's processes
        if: runner.os == 'macOS'
        run: |
          sudo dseditgroup -o edit -a "$USER" -t user _developer
          sudo dscacheutil -flushcache
          sudo security authorizationdb write system.privilege.taskport is-developer

      - name: Tests
        # Every suite runs even after one fails, so a run shows all that failed, not only the first binary's.
        run: cargo test -p rsharp-app --test debugger --no-fail-fast
