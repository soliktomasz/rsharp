[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
alacritty_terminal = "0.26"
portable-pty = "0.9"
rsharp-terminal = { path = "crates/rsharp-terminal" }
async_zip = { version = "0.0.17", default-features = false, features = ["deflate"] }
serde_json_lenient = { version = "0.2.4", features = ["preserve_order"] }
rsharp-core = { path = "crates/rsharp-core" }
rsharp-dap = { path = "crates/rsharp-dap" }
rsharp-text = { path = "crates/rsharp-text" }
rsharp-lsp = { path = "crates/rsharp-lsp" }
rsharp-languages = { path = "crates/rsharp-languages" }
rsharp-mcp = { path = "crates/rsharp-mcp" }
# runtime_shaders: macOS compiles gpui's Metal shaders at start, so a build needs no Metal toolchain.
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
encoding_rs = "0.8"
# gpui's own (0.25), for the XAML Preview's frames as images; no decoders, the frames being raw pixels.
image = { version = "0.25", default-features = false }
futures = "0.3"
imara-diff = "0.1"
# Held below 0.2.190, which dropped ENOATTR on Linux: gpui 0.2.2's xattr 0.2.3 (through its tar crate) needs it.
libc = ">=0.2.186, <0.2.190"
log = { version = "0.4", features = ["std"] }
regex = "1"
notify = "8"
quick-xml = "0.37"
ropey = "1.6"
trash = "5.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.25"
tree-sitter-c-sharp = "0.23"
# The platform verifier: a company feed signed by a certificate the system trusts is reached as restore reaches it.
ureq = { version = "3.5", default-features = false, features = ["rustls", "gzip", "platform-verifier"] }

[profile.dev.package."*"]
# Dependencies optimised even in debug builds: gpui's layout and tree-sitter's parser are slow unoptimised.
opt-level = 2
