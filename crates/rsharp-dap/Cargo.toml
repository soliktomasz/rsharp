[package]
name = "rsharp-dap"
description = "The Debug Adapter Protocol client, and Passenger's debug adapter it runs."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
log.workspace = true
rsharp-core.workspace = true
serde.workspace = true
serde_json.workspace = true
# A frame's source, decompiled by the adapter for an assembly that ships no symbols: the text its PDB embeds.
symbolic-ppdb = "14.0.0-alpha.4"

[build-dependencies]
rsharp-core.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes"] }
